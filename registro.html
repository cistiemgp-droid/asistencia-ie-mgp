<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Asistencia - IE MGP</title>

  <!-- Lector QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    :root {
      --azul: #0f2f55;
      --azul2: #2563eb;
      --celeste: #38bdf8;
      --verde: #059669;
      --rojo: #dc2626;
      --gris: #64748b;
      --fondo: #f1f5f9;
      --borde: #cbd5e1;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--fondo);
      padding: 15px;
      color: #1e293b;
    }

    .contenedor {
      max-width: 550px;
      margin: auto;
    }

    .encabezado {
      background: var(--azul);
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 12px 12px 0 0;
    }

    .encabezado h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .encabezado p {
      font-size: 12px;
      opacity: .9;
    }

    .card {
      background: var(--blanco);
      padding: 20px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .btn-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: #cbd5e1;
      color: #1e293b;
      font-weight: bold;
      border-radius: 7px;
      cursor: pointer;
    }

    .btn-tab.active {
      background: var(--azul2);
      color: white;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 7px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 7px;
    }

    .btn-camera {
      background: var(--verde);
      font-size: 16px;
      padding: 14px;
    }

    .btn-stop {
      background: var(--rojo);
    }

    .btn-manual {
      background: var(--gris);
    }

    .btn-volver {
      background: #475569;
    }

    #reader-container {
      display: none;
      margin-top: 15px;
      margin-bottom: 15px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
      border-radius: 8px;
    }

    #camera-status {
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
      color: var(--gris);
    }

    #manual-box {
      display: none;
      background: #f8fafc;
      padding: 14px;
      border: 1px dashed var(--borde);
      border-radius: 8px;
      margin-top: 15px;
    }

    #msg {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .warning {
      display: block !important;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .resultado-titulo {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .dato {
      margin: 5px 0;
      font-size: 14px;
    }

    .pie {
      text-align: center;
      font-size: 11px;
      color: var(--gris);
      margin-top: 15px;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>REGISTRO DE ASISTENCIA</h1>
    <p>IE JEC MANUEL GONZALES PRADA</p>
  </div>

  <div class="card">

    <!-- =================================================
         TIPO DE PERSONA
         ================================================= -->

    <div class="tabs">

      <button
        class="btn-tab active"
        id="tab-est"
        onclick="setTipo('estudiante')">
        ESTUDIANTES
      </button>

      <button
        class="btn-tab"
        id="tab-per"
        onclick="setTipo('personal')">
        PERSONAL
      </button>

    </div>


    <!-- =================================================
         ESTADO
         ================================================= -->

    <div class="form-group">

      <label for="estado">
        Estado de marcación
      </label>

      <select id="estado">

        <option value="INGRESO">
          INGRESO
        </option>

        <option value="SALIDA">
          SALIDA
        </option>

      </select>

    </div>


    <!-- =================================================
         CÁMARA
         ================================================= -->

    <button
      class="btn btn-camera"
      id="btn-camera"
      onclick="activarCamara()">
      📷 ACTIVAR CÁMARA
    </button>

    <button
      class="btn btn-stop"
      id="btn-stop"
      onclick="detenerCamara()"
      style="display:none;">
      ⛔ DETENER CÁMARA
    </button>


    <div id="camera-status">
      La cámara se activará al pulsar el botón.
    </div>


    <div id="reader-container">

      <div id="reader"></div>

    </div>


    <!-- =================================================
         REGISTRO MANUAL
         ================================================= -->

    <button
      class="btn btn-manual"
      onclick="toggleManual()">
      🪪 REGISTRAR POR DNI
    </button>


    <div id="manual-box">

      <div class="form-group">

        <label for="dni">
          DNI / Código
        </label>

        <input
          type="text"
          id="dni"
          inputmode="numeric"
          placeholder="Ingrese DNI">

      </div>

      <button
        class="btn btn-camera"
        onclick="registrarManual()">
        REGISTRAR DNI
      </button>

    </div>


    <!-- =================================================
         RESULTADO
         ================================================= -->

    <div id="msg"></div>


    <!-- =================================================
         VOLVER
         ================================================= -->

    <button
      class="btn btn-volver"
      onclick="volverInicio()">
      ← VOLVER AL PORTAL
    </button>

  </div>


  <div class="pie">
    Sistema de asistencia institucional
  </div>

</div>


<script>

  /* =====================================================
     CONFIGURACIÓN
     ===================================================== */

  const WEB_APP_URL =
    'https://script.google.com/macros/s/AKfycbwgLFPzerWoMaT1AdJSHFWZStxKKeg-QNbtnEz9ENuSM8j91j_X-uqyUMTZVqQKJDY/exec';


  let tipoActual = 'estudiante';

  let html5QrCode = null;

  let camaraActiva = false;

  let camaraFrontal = false;

  let procesando = false;

  let jsonpScript = null;


  /* =====================================================
     TIPO
     ===================================================== */

  function setTipo(tipo) {

    tipoActual = tipo;

    document
      .getElementById('tab-est')
      .classList.toggle(
        'active',
        tipo === 'estudiante'
      );

    document
      .getElementById('tab-per')
      .classList.toggle(
        'active',
        tipo === 'personal'
      );

  }


  /* =====================================================
     ACTIVAR CÁMARA
     ===================================================== */

  async function activarCamara() {

    if (camaraActiva) {
      return;
    }

    const readerContainer =
      document.getElementById(
        'reader-container'
      );

    const status =
      document.getElementById(
        'camera-status'
      );

    const btnCamera =
      document.getElementById(
        'btn-camera'
      );

    const btnStop =
      document.getElementById(
        'btn-stop'
      );


    try {

      status.textContent =
        'Solicitando acceso a la cámara...';

      readerContainer.style.display =
        'block';

      btnCamera.disabled =
        true;


      html5QrCode =
        new Html5Qrcode('reader');


      /*
       * Se solicita explícitamente
       * la cámara trasera.
       */

      await html5QrCode.start(

        {
  facingMode:
    camaraFrontal
      ? 'user'
      : 'environment'
},

        {
          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const size =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70;

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0

        },

        function(decodedText) {

          procesarRegistro(
            decodedText,
            'QR'
          );

        },

        function(errorMessage) {

          /*
           * Los errores normales de lectura QR
           * no se muestran al usuario.
           */

        }

      );


      camaraActiva = true;

      status.textContent =
        '📷 Cámara activa. Apunte al código QR.';

      btnCamera.style.display =
        'none';

      btnStop.style.display =
        'block';


    } catch (error) {

      console.error(error);

      camaraActiva = false;

      readerContainer.style.display =
        'none';

      btnCamera.disabled =
        false;

      status.textContent =
        'No se pudo iniciar la cámara.';

      mostrarMensaje(

        'error',

        '❌ No se pudo iniciar la cámara.<br><br>' +

        'Verifique que Chrome tenga permitido ' +
        'el acceso a la cámara para este sitio.'

      );

    }

  }


  /* =====================================================
     DETENER CÁMARA
     ===================================================== */

  async function detenerCamara() {

    if (!html5QrCode) {
      return;
    }


    try {

      await html5QrCode.stop();

      html5QrCode.clear();

    } catch (error) {

      console.log(
        'Cámara ya detenida.'
      );

    }


    html5QrCode = null;

    camaraActiva = false;


    document
      .getElementById(
        'reader-container'
      )
      .style.display = 'none';


    document
      .getElementById(
        'btn-camera'
      )
      .style.display = 'block';


    document
      .getElementById(
        'btn-camera'
      )
      .disabled = false;


    document
      .getElementById(
        'btn-stop'
      )
      .style.display = 'none';


    document
      .getElementById(
        'camera-status'
      )
      .textContent =
      'La cámara está detenida.';

  }


  /* =====================================================
     REGISTRO QR / DNI
     ===================================================== */

  function procesarRegistro(
    idCodigo,
    metodo
  ) {

    if (procesando) {
      return;
    }


   const contenidoQR =
  String(idCodigo || '').trim();

const partesQR =
  contenidoQR.split(',');

const id =
  String(partesQR[0] || '')
    .replace(/\s+/g, '')
    .trim();

    if (!id) {
      return;
    }


    procesando = true;


    const estado =
      document
        .getElementById('estado')
        .value;


    mostrarMensaje(
      'warning',
      '⏳ Procesando registro...<br>' +
      'Buscando DNI/Código: <strong>' +
      escapar(id) +
      '</strong>'
    );


   


    eliminarJSONP();


    jsonpScript =
      document.createElement(
        'script'
      );


    jsonpScript.src =
      WEB_APP_URL +

      '?action=apiRegistrar' +

      '&id=' +
      encodeURIComponent(id) +

      '&tipo=' +
      encodeURIComponent(tipoActual) +

      '&estado=' +
      encodeURIComponent(estado) +

      '&callback=respuestaRegistro';


    jsonpScript.onerror =
      function() {

        procesando = false;

        mostrarMensaje(
          'error',
          '❌ No se pudo conectar con el servidor.'
        );

        eliminarJSONP();

      };


    document.body.appendChild(
      jsonpScript
    );

  }


  /* =====================================================
     RESPUESTA REGISTRO
     ===================================================== */

  function respuestaRegistro(data) {

    eliminarJSONP();


    if (!data) {

      procesando = false;

      mostrarMensaje(
        'error',
        '❌ El servidor no devolvió una respuesta válida.'
      );

      return;
    }


    if (!data.exito) {

      procesando = false;

      mostrarMensaje(
        'error',
        '<div class="resultado-titulo">' +
        '❌ NO REGISTRADO' +
        '</div>' +
        '<div>' +
        escapar(
          data.mensaje ||
          'No fue posible registrar la asistencia.'
        ) +
        '</div>'
      );

      return;
    }


    const datos =
      data.datos || {};


    const nombre =
      datos.nombre || 'N/A';


    const id =
      datos.id || 'N/A';


    const detalle =
      tipoActual === 'personal'

        ? (datos.perfil || 'N/A')

        : (datos.gradoSeccion || 'N/A');


    const etiqueta =
      tipoActual === 'personal'

        ? 'Cargo'

        : 'Grado/Sección';


    mostrarMensaje(

      'success',

      '<div class="resultado-titulo">' +

      '✅ ' +
      escapar(
        data.estado ||
        'REGISTRO'
      ) +

      ' REGISTRADO' +

      '</div>' +

      '<div class="dato">' +
      '<strong>DNI/ID:</strong> ' +
      escapar(id) +
      '</div>' +

      '<div class="dato">' +
      '<strong>Nombre:</strong> ' +
      escapar(nombre) +
      '</div>' +

      '<div class="dato">' +
      '<strong>' +
      etiqueta +
      ':</strong> ' +
      escapar(detalle) +
      '</div>' +

      '<div class="dato">' +
      '<strong>Hora:</strong> ' +
      escapar(data.hora || 'N/A') +
      '</div>' +

      '<div class="dato">' +
      '<strong>Puntualidad:</strong> ' +
      escapar(data.puntualidad || 'N/A') +
      '</div>'

    );


    document
      .getElementById('dni')
      .value = '';


    /*
     * Permitimos un nuevo registro
     * después de mostrar el resultado.
     */

    setTimeout(
      function() {

        procesando = false;

      },
      2500
    );

  }


  /* =====================================================
     REGISTRO MANUAL
     ===================================================== */

  function registrarManual() {

    const dni =
      document
        .getElementById('dni')
        .value
        .trim();


    if (!dni) {

      mostrarMensaje(
        'error',
        '❌ Ingrese un DNI.'
      );

      return;
    }


    procesarRegistro(
      dni,
      'DNI'
    );

  }


  /* =====================================================
     MOSTRAR / OCULTAR MANUAL
     ===================================================== */

  function toggleManual() {

    const box =
      document.getElementById(
        'manual-box'
      );


    if (
      box.style.display ===
      'block'
    ) {

      box.style.display =
        'none';

    } else {

      box.style.display =
        'block';

      document
        .getElementById('dni')
        .focus();

    }

  }


  /* =====================================================
     MENSAJES
     ===================================================== */

  function mostrarMensaje(
    tipo,
    texto
  ) {

    const msg =
      document.getElementById(
        'msg'
      );


    msg.className = tipo;

    msg.innerHTML =
      texto;

    msg.style.display =
      'block';

  }


  /* =====================================================
     JSONP
     ===================================================== */

  function eliminarJSONP() {

    if (jsonpScript) {

      jsonpScript.remove();

      jsonpScript = null;

    }

  }


  /* =====================================================
     ESCAPAR TEXTO
     ===================================================== */

  function escapar(valor) {

    return String(valor || '')
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =====================================================
     VOLVER AL PORTAL
     ===================================================== */

  async function volverInicio() {

    await detenerCamara();

    window.location.href =
      'index.html';

  }


  /* =====================================================
     SEGURIDAD DE ACCESO
     ===================================================== */

  /*
   * El acceso se valida desde index.html.
   * Si no existe la marca de sesión, volvemos al portal.
   */

  if (
    sessionStorage.getItem(
      'accesoRegistro'
    ) !== '1'
  ) {

    window.location.href =
      'index.html';

  }

</script>

</body>
</html>
